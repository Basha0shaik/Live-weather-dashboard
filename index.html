<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Live Weather</title>


    <!-- =====================================================
         BOOTSTRAP
         ===================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         COMFORTAA FONT
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         OUR CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="index.css"
    >

</head>


<body>


    <!-- =====================================================
         SEARCH AREA
         ===================================================== -->

    <div class="searchBar">

        <div class="searchBarParentDiv">


            <!-- =================================================
                 SEARCH INPUT + SEARCH BUTTON
                 ================================================= -->

            <div class="searchInputWrapper">

                <input
                    type="text"
                    class="inputfield"
                    id="cityInput"
                    placeholder="Search City"
                    autocomplete="off"
                >


                <!-- SEARCH BUTTON -->

                <button
                    type="button"
                    class="searchButton"
                    onclick="fetchWeather()"
                    aria-label="Search"
                >

                    <img
                        src="assets/search.png"
                        alt="Search"
                    >

                </button>

            </div>


            <!-- =================================================
                 USE MY LOCATION
                 ================================================= -->

            <button
                id="locationBtn"
                class="locationBtn"
                onclick="getCurrentLocation()"
            >

                📍 Use My Location

            </button>


            <!-- =================================================
                 RECENT SEARCHES
                 ================================================= -->

            <div
                id="recentSearches"
                class="recentSearches"
            ></div>

            <!-- FORECAST WEATHER ALERT -->
                <div id="forecastAlertContainer"></div>


            <!-- =================================================
                 TEMPERATURE UNIT TOGGLE
                 ================================================= -->

            <div class="unitToggle">

                <button
                    id="celsiusBtn"
                    class="unitBtn active"
                    onclick="changeUnit('metric')"
                >
                    °C
                </button>

                <button
                    id="fahrenheitBtn"
                    class="unitBtn"
                    onclick="changeUnit('imperial')"
                >
                    °F
                </button>

            </div>


        </div>

    </div>

    <!-- ================= WEATHER ALERT ================= -->

    <div
        id="weatherAlert"
        class="weatherAlert"
        style="display: none;"
    >

        <div class="alertIcon" id="alertIcon">
            ⚠️
        </div>

    <div class="alertContent">

        <div
            class="alertTitle"
            id="alertTitle"
        >
            Weather Alert
        </div>

        <div
            class="alertMessage"
            id="alertMessage"
        >
            Weather conditions require attention.
        </div>

    </div>

    <button
        class="alertClose"
        onclick="closeWeatherAlert()"
        aria-label="Close alert"
    >
        ×
    </button>

</div>



    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <div class="mainContentParentDiv d-flex">


        <!-- =================================================
             LEFT SIDE
             ================================================= -->

        <div class="leftDiv">


            <!-- =================================================
                 CURRENT WEATHER
                 ================================================= -->

            <div
                class="currentTempDiv leftChild p-3 d-flex flex-column gap-2"
            >

                <!-- CITY -->

                <h6
                    class="m-0"
                    id="cityName"
                >
                    City Name
                </h6>


                <!-- TEMPERATURE -->

                <h5 class="m-0">

                    <span id="cityTemp">
                        -
                    </span>

                    <span id="temperatureUnit">
                        &deg;C
                    </span>

                </h5>


                <!-- WEATHER DESCRIPTION -->

                <h6
                    class="m-0"
                    id="skyDesc"
                >
                    Sky Description
                </h6>


                <!-- DIVIDER -->

                <hr class="line">


                <!-- =================================================
                     DATE
                     ================================================= -->

                <div class="d-flex gap-2">

                    <img
                        src="assets/calendar.png"
                        alt="Date"
                        width="25px"
                    >

                    <h6
                        class="m-0"
                        id="date"
                    >
                        Date
                    </h6>

                </div>


                <!-- =================================================
                     TIME
                     ================================================= -->

                <div class="d-flex gap-2">

                    <img
                        src="assets/time.png"
                        alt="Time"
                        width="25px"
                    >

                    <h6
                        class="m-0"
                        id="time"
                    >
                        Time
                    </h6>

                </div>


            </div>



            <!-- =================================================
                 COMING 5 DAYS
                 ================================================= -->

            <div
                class="nextFiveDays leftChild p-3 d-flex flex-column gap-2"
            >

                <h6
                    class="m-0"
                    id="comingFiveDaysTitle"
                >
                    Coming 5 Days
                </h6>


                <div
                    id="forecastContainer"
                    class="d-flex flex-column gap-1"
                >

                </div>


            </div>


        </div>



        <!-- =================================================
             RIGHT SIDE
             ================================================= -->

        <div class="rightDiv">


            <!-- =================================================
                 TOP METRICS
                 ================================================= -->

            <div
                class="rightRow rowOne d-flex gap-2 justify-content-between align-items-center"
            >


                <!-- =================================================
                     HUMIDITY
                     ================================================= -->

                <div class="extraMetric d-flex gap-3">

                    <img
                        src="assets/flood.png"
                        alt="Humidity"
                        width="35px"
                    >

                    <div>

                        <h6 class="m-0">
                            Humidity
                        </h6>

                        <h6
                            class="m-0"
                            id="humidity"
                        >
                            -
                        </h6>

                    </div>

                </div>



                <!-- =================================================
                     PRESSURE
                     ================================================= -->

                <div class="extraMetric d-flex gap-3">

                    <img
                        src="assets/wind (1).png"
                        alt="Pressure"
                        width="35px"
                    >

                    <div>

                        <h6 class="m-0">
                            Pressure
                        </h6>

                        <h6
                            class="m-0"
                            id="pressure"
                        >
                            -
                        </h6>

                    </div>

                </div>



                <!-- =================================================
                     FEELS LIKE
                     ================================================= -->

                <div class="extraMetric d-flex gap-3">

                    <img
                        src="assets/hot.png"
                        alt="Feels like"
                        width="35px"
                    >

                    <div>

                        <h6 class="m-0">
                            Feels like
                        </h6>

                        <h6
                            class="m-0"
                            id="feelsLike"
                        >
                            -
                        </h6>

                    </div>

                </div>



                <!-- =================================================
                     VISIBILITY
                     ================================================= -->

                <div class="extraMetric d-flex gap-3">

                    <img
                        src="assets/eye.png"
                        alt="Visibility"
                        width="35px"
                    >

                    <div>

                        <h6 class="m-0">
                            Visibility
                        </h6>

                        <h6
                            class="m-0"
                            id="visiblity"
                        >
                            -
                        </h6>

                    </div>

                </div>


            </div>



            <!-- =================================================
                 AQI + SUNRISE / SUNSET
                 ================================================= -->

            <div
                class="rightRow rowTwo d-flex justify-content-between align-items-center"
            >


                <!-- =================================================
                     AIR QUALITY INDEX
                     ================================================= -->

                <div
                    class="AQI rowTwoDiv p-3 d-flex flex-column gap-2"
                >

                    <h5>
                        Air Quality Index (AQI)
                    </h5>


                    <div
                        class="d-flex align-items-center justify-content-between"
                    >


                        <!-- AQI ICON -->

                        <img
                            src="assets/wind (1).png"
                            alt="AQI"
                            width="40px"
                        >


                        <!-- CO -->

                        <div class="text-center">

                            <h6>
                                CO
                            </h6>

                            <h6 id="coValue">
                                -
                            </h6>

                        </div>


                        <!-- SO2 -->

                        <div class="text-center">

                            <h6>
                                SO2
                            </h6>

                            <h6 id="so2Value">
                                -
                            </h6>

                        </div>


                        <!-- O3 -->

                        <div class="text-center">

                            <h6>
                                O3
                            </h6>

                            <h6 id="o3Value">
                                -
                            </h6>

                        </div>


                        <!-- NO2 -->

                        <div class="text-center">

                            <h6>
                                NO2
                            </h6>

                            <h6 id="no2Value">
                                -
                            </h6>

                        </div>


                    </div>

                </div>



                <!-- =================================================
                     SUNRISE / SUNSET
                     ================================================= -->

                <div
                    class="sunRise rowTwoDiv p-3 gap-2"
                >


                    <h5 class="m-0">
                        Sunrise &amp; Sunset
                    </h5>


                    <div class="d-flex justify-content-between">


                        <!-- =================================================
                             SUNRISE
                             ================================================= -->

                        <div
                            class="sunriseDiv d-flex gap-2 align-items-center"
                        >

                            <img
                                src="assets/sun (1).png"
                                alt="Sunrise"
                                width="75px"
                            >


                            <div
                                class="d-flex flex-column gap-1"
                            >

                                <h6 class="m-0">
                                    Sunrise
                                </h6>

                                <h5
                                    class="m-0"
                                    id="sunriseTime"
                                >
                                    -:-- Am
                                </h5>

                            </div>

                        </div>



                        <!-- =================================================
                             SUNSET
                             ================================================= -->

                        <div
                            class="sunsetDiv d-flex gap-2 align-items-center"
                        >

                            <img
                                src="assets/moon.png"
                                alt="Sunset"
                                width="65px"
                            >


                            <div
                                class="d-flex flex-column gap-2"
                            >

                                <h6 class="m-0">
                                    Sunset
                                </h6>

                                <h5
                                    class="m-0"
                                    id="sunsetTime"
                                >
                                    -:-- Pm
                                </h5>

                            </div>

                        </div>


                    </div>


                </div>


            </div>



            <!-- =================================================
                 TODAY
                 ================================================= -->

            <div
                class="rightRow rowThree d-flex flex-column gap-2"
            >

                <h5 class="m-0">
                    Today
                </h5>


                <div
                    class="d-flex justify-content-between todayTempParentDiv"
                    id="todayTempContainer"
                >

                </div>


            </div>


        </div>


    </div>



    <!-- =====================================================
         BOOTSTRAP JAVASCRIPT
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =====================================================
         OUR JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>


</body>

</html>
